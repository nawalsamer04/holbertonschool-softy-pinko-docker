<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Softy Pinko</title>

    <!-- jQuery (needed for AJAX) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

    <!-- Dynamic content -->
    <h1 id="dynamic-content"></h1>

    <!-- Original text -->
    <h1>We provide the best strategy to grow up your business</h1>

    <!-- Script for API connection -->
    <script>
        $(function() {
            $.ajax({
                type: "GET",
                url: "http://localhost:5252/api/hello",
                success: function(data) {
                    console.log(data);
                    $('#dynamic-content').text(data);
                }
            });
        });
    </script>

</body>
</html>
